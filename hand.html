<!DOCTYPE html>
<html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>היד של לוקה</title>
<style>body{font-family:system-ui,sans-serif;background:#0b1622;color:#d8ecf5;text-align:center;padding:40px 20px}
h1{letter-spacing:4px;color:#bff1fb}#st{font-size:20px;margin:18px}#log{opacity:.7;font-size:14px;max-width:560px;margin:20px auto;text-align:right;line-height:1.7}
button{padding:14px 34px;font-size:17px;border-radius:30px;border:none;background:#36d1e0;color:#04222b;font-weight:700;cursor:pointer}
input{padding:12px;border-radius:10px;border:1px solid #2b4c60;background:#0d1e2b;color:#e6f6fb;font-size:16px;margin:6px}.hidden{display:none}</style></head>
<body>
<h1>היד של לוקה</h1>
<p>השאר את הדף הזה פתוח במחשב. כשתבקש מלוקה לפתוח משהו במחשב, הוא ייפתח כאן בלשונית חדשה.</p>
<div id="st">—</div>
<div id="pair" class="hidden"><input id="code" inputmode="numeric" maxlength="6" placeholder="קוד בן 6 ספרות"><br></div>
<button id="go">חבר את המחשב</button>
<div id="log"></div>
<script>
"use strict";
const $ = id => document.getElementById(id);
const log = t => { $("log").innerHTML = new Date().toLocaleTimeString("he-IL") + " — " + t + "<br>" + $("log").innerHTML; };
let pairing = false, running = false;
function openUrl(u){
  const w = window.open(u, "_blank");
  if(!w){ $("st").textContent = "הדפדפן חסם את הפתיחה. אשר חלונות קופצים לאתר הזה (סמל בשורת הכתובת) ונסה שוב."; log("נחסם: " + u); return; }
  log("נפתח: " + u);
}
async function loop(){
  if(running) return; running = true; $("go").classList.add("hidden"); $("pair").classList.add("hidden");
  for(;;){
    try{
      const r = await fetch("/computer/next", { headers:{ "x-luka-token": localStorage.getItem("luka_token") || "" } });
      if(r.status === 401){ localStorage.removeItem("luka_token"); running = false; $("go").classList.remove("hidden"); $("st").textContent = "החיבור פג. לחץ לחיבור מחדש."; return; }
      const j = await r.json();
      $("st").textContent = "מחובר. מחכה לפקודות מלוקה.";
      for(const c of (j.items || [])) if(c.type === "open") openUrl(c.url);
    }catch(e){ $("st").textContent = "אין חיבור לשרת, מנסה שוב…"; }
    await new Promise(r => setTimeout(r, 2000));
  }
}
$("go").addEventListener("click", async ()=>{
  if(localStorage.getItem("luka_token")) return loop();
  const code = $("code").value.trim();
  if(!pairing || !code){
    const r = await fetch("/pair/request", { method:"POST" });
    if(!r.ok && r.status !== 429){ $("st").textContent = "לא הצלחתי לשלוח קוד. נסה שוב בעוד דקה."; return; }
    pairing = true; $("pair").classList.remove("hidden"); $("st").textContent = "שלחתי קוד לטלפון שלך. הזן אותו ולחץ שוב."; return;
  }
  const r = await fetch("/pair/confirm", { method:"POST", headers:{ "content-type":"application/json" }, body: JSON.stringify({ code }) });
  if(!r.ok){ $("st").textContent = "הקוד שגוי או שפג תוקפו."; return; }
  localStorage.setItem("luka_token", (await r.json()).token); loop();
});
if(localStorage.getItem("luka_token")){ $("st").textContent = "לחץ כדי להתחיל (נדרש פעם אחת בכל פתיחה)."; $("go").textContent = "התחל"; }
</script></body></html>
